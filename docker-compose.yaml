version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "80:80"
    # environment:
    #   - DB_CONNECTION=pgsql
    #   - DB_HOST=postgres
    #   - DB_PORT=5432
    #   - DB_DATABASE=laravel
    #   - DB_USERNAME=laravel
